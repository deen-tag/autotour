<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visite 360°</title>
<style>
:root{--bg:#eef0f2;--fg:#15181b;--mut:#5b6670;--line:#cfd5da;--acc:#0f6b7c;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101315;--fg:#eef1f3;--mut:#9aa6af;--line:#2a3136;--acc:#5cc3d6;--accfg:#06262c}}
:root[data-theme="dark"]{--bg:#101315;--fg:#eef1f3;--mut:#9aa6af;--line:#2a3136;--acc:#5cc3d6;--accfg:#06262c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header,.track,.tools,.note{max-width:760px;margin-left:auto;margin-right:auto;padding-left:16px;padding-right:16px}
header{padding-top:20px;padding-bottom:12px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
#src{margin:2px 0 0;color:var(--mut);font-size:.95rem}
.stage{position:relative;max-width:760px;margin:0 auto;background:#c3cbd1;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
@media (min-width:760px){.stage{border-radius:14px;overflow:hidden}}
canvas{display:block;width:100%;height:auto}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(16,19,21,.72);color:#fff;padding:7px 14px;border-radius:99px;font-size:.9rem;transition:opacity .4s;pointer-events:none}
.hint.off{opacity:0}
.load{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,19,21,.62);color:#fff;font-weight:600;text-align:center;padding:16px}
.load[hidden]{display:none}
.track{margin-top:16px}
.rail{height:4px;background:var(--line);border-radius:4px;position:relative}
#bar{position:absolute;top:-4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
button{font:inherit;font-weight:600;border-radius:10px;padding:11px 16px;cursor:pointer;border:1.5px solid var(--acc);background:transparent;color:var(--fg)}
button.main{background:var(--acc);color:var(--accfg)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.note{margin-top:16px;margin-bottom:32px;color:var(--mut);font-size:.95rem}
</style>
</head>
<body>
<header>
  <h1>Visite 360°</h1>
  <p id="src">Démonstration : véhicule fictif</p>
</header>
<div class="stage" id="stage" tabindex="0" aria-label="Véhicule à faire tourner. Flèches gauche et droite pour tourner.">
  <canvas id="cv" width="640" height="360"></canvas>
  <div class="hint" id="hint">Glisse pour tourner</div>
  <div class="load" id="load" hidden></div>
</div>
<div class="track"><div class="rail"><div id="bar"></div></div></div>
<div class="tools">
  <button class="main" id="bv">Tester avec ma vidéo</button>
  <button id="bp">Tester avec mes photos</button>
  <button id="bd">Revoir la démo</button>
</div>
<input type="file" id="fv" accept="video/*" hidden>
<input type="file" id="fp" accept="image/*" multiple hidden>
<p class="note">Pour un vrai test, filme un tour complet autour du véhicule, à hauteur constante et sans t'arrêter (30 à 60 secondes). Le visualiseur en extrait 36 images à intervalle régulier.</p>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
let frames=[],pos=0,cur=-1,vel=0,drag=false,last=0;
let auto=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ---------- Véhicule de démonstration (modèle 3D simple, rendu image par image) ---------- */
const M=[],paint=[22,98,116],glass=[34,48,58];
const face=(v,n,c,l=0)=>M.push({v,n,c,l});
function box(x0,x1,y0,y1,z0,z1,c){
  face([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],[1,0,0],c);
  face([[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]],[-1,0,0],c);
  face([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],[0,1,0],c);
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[0,0,1],c);
  face([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],[0,0,-1],c);
}
const circ=(cx,cy,z,r,n)=>Array.from({length:n},(_,k)=>[cx+r*Math.cos(k/n*6.2832),cy+r*Math.sin(k/n*6.2832),z]);
box(-2.2,2.2,.32,.95,-.9,.9,paint);
const P=[[-1.3,.95],[-.85,1.45],[.6,1.45],[1.15,.95]];
[-1,1].forEach(s=>face(P.map(p=>[p[0],p[1],s*.78]),[0,0,s],glass));
face([[-.85,1.45,-.78],[.6,1.45,-.78],[.6,1.45,.78],[-.85,1.45,.78]],[0,1,0],paint);
face([[.6,1.45,-.78],[1.15,.95,-.78],[1.15,.95,.78],[.6,1.45,.78]],[.67,.74,0],glass);
face([[-.85,1.45,-.78],[-1.3,.95,-.78],[-1.3,.95,.78],[-.85,1.45,.78]],[-.74,.67,0],glass);
[-1,1].forEach(s=>[-1.4,1.4].forEach(x=>{
  face(circ(x,.36,s*.93,.36,18),[0,0,s],[18,18,20],1);
  face(circ(x,.36,s*.94,.2,10),[0,0,s],[160,166,172],2);
  face([[2.21,.62,s*.45],[2.21,.78,s*.45],[2.21,.78,s*.8],[2.21,.62,s*.8]],[1,0,0],[255,240,190],1);
  face([[-2.21,.62,s*.45],[-2.21,.78,s*.45],[-2.21,.78,s*.8],[-2.21,.62,s*.8]],[-1,0,0],[200,30,40],1);
}));

function render(g,W,H,a){
  const ca=Math.cos(a),sa=Math.sin(a),cp=Math.cos(.22),sp=Math.sin(.22),D=9.5,F=W*1.64;
  const T=p=>{const x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca,y=p[1]-.7;return[x,y*cp+z*sp,-y*sp+z*cp]};
  const R=n=>{const x=n[0]*ca+n[2]*sa,z=-n[0]*sa+n[2]*ca;return[x,n[1]*cp+z*sp,-n[1]*sp+z*cp]};
  const J=q=>{const d=q[2]+D;return[W/2+F*q[0]/d,H*.6-F*q[1]/d]};
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#dfe4e8');bg.addColorStop(.55,'#b9c2c8');bg.addColorStop(.56,'#a3adb4');bg.addColorStop(1,'#8b959c');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  [[2.9,1.5,.16],[2.5,1.15,.22]].forEach(([lx,lz,al])=>{
    g.beginPath();
    [[-lx,-lz],[lx,-lz],[lx,lz],[-lx,lz]].forEach((p,i)=>{const q=J(T([p[0],0,p[1]]));i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});
    g.fillStyle='rgba(0,0,0,'+al+')';g.fill();
  });
  const out=[];
  for(const f of M){
    const n=R(f.n);if(n[2]>=0)continue;
    const q=f.v.map(T),z=q.reduce((s,p)=>s+p[2],0)/q.length;
    const b=.42+.58*Math.max(0,-.35*n[0]+.7*n[1]-.6*n[2]);
    out.push({q,z,l:f.l,c:'rgb('+f.c.map(v=>v*b|0)+')'});
  }
  out.sort((x,y)=>x.l-y.l||y.z-x.z);
  for(const o of out){
    g.beginPath();
    o.q.forEach((p,i)=>{const s=J(p);i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1])});
    g.closePath();g.fillStyle=o.c;g.strokeStyle=o.c;g.lineWidth=.7;g.fill();g.stroke();
  }
}
function demo(){
  const N=36,f=[];
  for(let i=0;i<N;i++){const c=mk(640,360);render(c.getContext('2d'),640,360,i/N*6.2832);f.push(c)}
  setFrames(f,'Démonstration : véhicule fictif');pos=4;
}

/* ---------- Visualiseur ---------- */
function setFrames(f,label){frames=f;cv.width=f[0].width;cv.height=f[0].height;cur=-1;pos=0;vel=0;$('src').textContent=label}
function show(){
  const n=frames.length,i=((Math.round(pos)%n)+n)%n;
  if(i!==cur){cur=i;ctx.drawImage(frames[i],0,0);$('bar').style.left=(i/n*100)+'%'}
}
const k=()=>frames.length/(stage.clientWidth*1.1||400);
stage.addEventListener('pointerdown',e=>{drag=true;auto=false;last=e.clientX;vel=0;stage.setPointerCapture(e.pointerId);$('hint').classList.add('off');stage.style.cursor='grabbing'});
stage.addEventListener('pointermove',e=>{if(!drag)return;const d=(e.clientX-last)*k();last=e.clientX;pos+=d;vel=d});
const up=()=>{drag=false;stage.style.cursor='grab'};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){pos-=1;auto=false}if(e.key==='ArrowRight'){pos+=1;auto=false}});
(function loop(){
  if(!drag){if(auto)pos+=.05;else{pos+=vel;vel*=.94;if(Math.abs(vel)<.005)vel=0}}
  if(frames.length)show();
  requestAnimationFrame(loop);
})();

/* ---------- Import de vidéo ou de photos ---------- */
const busy=t=>{const l=$('load');l.hidden=!t;l.textContent=t||''};
const once=(el,ev,ms=10000)=>new Promise((res,rej)=>{
  const t=setTimeout(()=>rej(new Error('timeout')),ms);
  el.addEventListener(ev,()=>{clearTimeout(t);res()},{once:true});
  el.addEventListener('error',()=>{clearTimeout(t);rej(new Error('lecture'))},{once:true});
});
const fit=(w,h)=>{const s=Math.min(1,800/w);return[Math.round(w*s),Math.round(h*s)]};
function fail(){busy('Ce fichier n\u2019a pas pu être lu. Essaie une vidéo MP4 ou MOV, ou des photos JPG.');setTimeout(()=>busy(''),3500)}

async function fromVideo(file){
  const url=URL.createObjectURL(file),v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';
  try{
    busy('Lecture de la vidéo…');
    let p=once(v,'loadeddata');v.src=url;v.load();await p;
    const N=36,d=v.duration,[w,h]=fit(v.videoWidth,v.videoHeight),f=[];
    if(!isFinite(d)||!w)throw new Error('durée');
    for(let i=0;i<N;i++){
      busy('Extraction des images '+(i+1)+' sur '+N);
      p=once(v,'seeked');v.currentTime=d*(i+.5)/N;await p;
      const c=mk(w,h);c.getContext('2d').drawImage(v,0,0,w,h);f.push(c);
    }
    setFrames(f,'Ta vidéo, '+N+' images extraites');pos=0;auto=true;busy('');
  }catch(e){fail()}
  URL.revokeObjectURL(url);
}
async function fromPhotos(files){
  const list=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).slice(0,72);
  if(list.length<8){busy('Choisis au moins 8 photos prises en tournant autour du véhicule.');setTimeout(()=>busy(''),3500);return}
  try{
    const f=[];
    for(let i=0;i<list.length;i++){
      busy('Chargement des photos '+(i+1)+' sur '+list.length);
      const url=URL.createObjectURL(list[i]),im=new Image();
      const p=once(im,'load');im.src=url;await p;
      if(!i){}
      const [w,h]=fit(im.naturalWidth,im.naturalHeight),c=mk(w,h);
      c.getContext('2d').drawImage(im,0,0,w,h);f.push(c);URL.revokeObjectURL(url);
    }
    const w0=f[0].width,h0=f[0].height;
    setFrames(f.map(c=>{if(c.width===w0&&c.height===h0)return c;const r=mk(w0,h0);r.getContext('2d').drawImage(c,0,0,w0,h0);return r}),'Tes photos, '+f.length+' images');
    pos=0;auto=true;busy('');
  }catch(e){fail()}
}
$('bv').onclick=()=>$('fv').click();
$('bp').onclick=()=>$('fp').click();
$('bd').onclick=()=>{demo();auto=true;$('hint').classList.remove('off')};
$('fv').onchange=e=>{if(e.target.files[0])fromVideo(e.target.files[0]);e.target.value=''};
$('fp').onchange=e=>{if(e.target.files.length)fromPhotos(e.target.files);e.target.value=''};
demo();
</script>
</body>
</html>
